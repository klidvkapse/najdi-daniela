<!doctype html><html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#173d32"><title>Správa hry – Najdi Daniela</title><link rel="stylesheet" href="style.css"><style>body{background:#f4f2ec}.admin-wrap{max-width:850px;margin:35px auto;padding:0 20px}.admin-card{background:#fff;border:1px solid #e5e0d6;border-radius:18px;padding:26px;margin:16px 0}.field{display:grid;gap:7px;margin:15px 0}.field label{font-size:11px;font-weight:800}.field input,.field textarea{width:100%;border:1px solid #dcd8cf;border-radius:9px;padding:12px;font:14px Raleway,Arial,sans-serif}.field textarea{min-height:75px}.hint{font-size:12px;line-height:1.6;color:#69776e}.post-row{border:1px solid #e5e0d6;padding:14px;border-radius:12px;margin:12px 0}.post-row textarea{width:100%;padding:10px;margin:6px 0;border:1px solid #ddd;border-radius:8px}.small-btn{border:0;background:#eee8dc;border-radius:20px;padding:9px 14px;font-weight:700;cursor:pointer}.status{padding:10px 0;font-size:13px}</style></head><body><header class="topbar"><a class="brand" href="index.html"><span class="brand-mark">☕</span><span>NAJDI <b>DANIELA</b></span></a><span class="edition">ADMINISTRACE</span></header><main class="admin-wrap"><section class="admin-card"><p class="eyebrow">TVÉ OVLÁDACÍ CENTRUM</p><h1>Zprávy od Daniela</h1><p class="hint">Přihlas se, přidej fotografii a komentář. Zprávy se ukládají na Google Disk a hráčům se obnovují automaticky.</p><div class="field"><label>HESLO ADMINISTRÁTORA</label><input id="password" type="password" autocomplete="current-password"></div><button class="small-btn" id="login">Přihlásit se</button><p id="status" class="status" aria-live="polite"></p></section><section id="editor" class="admin-card" hidden><h2>Nová zpráva</h2><div class="field"><label>FOTOGRAFIE Z MOBILU</label><input id="photo" type="file" accept="image/*" capture="environment"></div><div class="field"><label>KOMENTÁŘ</label><textarea id="message" placeholder="Tak už jsem tady a čekám na prvního z vás. ☕"></textarea></div><button class="small-btn" id="publish">Zveřejnit zprávu</button></section><section id="saved" class="admin-card" hidden><h2>Zveřejněné zprávy</h2><div id="posts"></div></section></main>
<script>
const API_URL="https://script.google.com/macros/s/AKfycbys7uP-yDkuPY0k_aGFawtPYuYU1uyb5UimvQs1JxU8Bgk-N7B-u472mU-VF4v2GEhRAQ/exec";const $=id=>document.getElementById(id);let password="";
function getMessages(){return new Promise((resolve,reject)=>{const cb="__msg"+Math.random().toString(36).slice(2),s=document.createElement("script");const timer=setTimeout(()=>{clean();reject(Error("Vypršel čas načítání."));},12000);function clean(){clearTimeout(timer);delete window[cb];s.remove();}window[cb]=d=>{clean();resolve(d);};s.onerror=()=>{clean();reject(Error("Nepodařilo se načíst zprávy."));};s.src=API_URL+"?callback="+cb+"&t="+Date.now();document.head.appendChild(s);});}
async function refresh(){const d=await getMessages();if(!d.success)throw Error(d.error||"Chyba načítání");render(d.messages||[]);}
function render(items){$("posts").innerHTML="";if(!items.length){$("posts").textContent="Zatím nejsou zveřejněné žádné zprávy.";return;}items.forEach(m=>{const row=document.createElement("div");row.className="post-row";const title=document.createElement("b");title.textContent="Zpráva";row.appendChild(title);if(m.imageUrl){const img=document.createElement("img");img.src=m.imageUrl;img.alt="Fotografie zprávy";img.style="max-width:180px;max-height:120px;display:block;margin:8px 0";row.appendChild(img);}const ta=document.createElement("textarea");ta.value=m.message||m.text||"";row.appendChild(ta);const edit=document.createElement("button");edit.className="small-btn";edit.textContent="Uložit změnu";edit.onclick=()=>send({action:"update",id:m.id,message:ta.value});const del=document.createElement("button");del.className="small-btn";del.textContent="Smazat";del.onclick=()=>{if(confirm("Opravdu smazat zprávu?"))send({action:"delete",id:m.id});};row.append(edit,del);$("posts").appendChild(row);});}
async function send(data){$("status").textContent="Odesílám…";try{await fetch(API_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({...data,password})});await new Promise(r=>setTimeout(r,1800));await refresh();$("status").textContent="Hotovo – seznam zpráv byl znovu načten.";}catch(e){$("status").textContent="Nepodařilo se ověřit změnu: "+e.message;}}
$("login").onclick=async()=>{password=$("password").value;if(!password){$("status").textContent="Zadej heslo.";return;}try{await refresh();$("editor").hidden=false;$("saved").hidden=false;$("status").textContent="Připojeno k seznamu zpráv.";}catch(e){$("status").textContent="Chyba spojení: "+e.message;}};
$("publish").onclick=async()=>{const file=$("photo").files[0],message=$("message").value.trim();if(!file&&!message){$("status").textContent="Přidej fotografii nebo text.";return;}const data={action:"publish",message};if(file){if(file.size>4*1024*1024){$("status").textContent="Vyber fotografii do 4 MB.";return;}const dataUrl=await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(file);});data.imageBase64=String(dataUrl).split(",")[1];data.mimeType=file.type||"image/jpeg";}await send(data);$("message").value="";$("photo").value="";};
</script></body></html>
